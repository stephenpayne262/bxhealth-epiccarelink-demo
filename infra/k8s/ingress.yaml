apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bxhealth-epiccarelink-demo
  namespace: ping-devops-stephenpayne
  annotations:
    external-dns.alpha.kubernetes.io/hostname: bxhealth-epiccarelink-demo.ping-devops.com
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
spec:
  ingressClassName: nginx-public
  rules:
    - host: bxhealth-epiccarelink-demo.ping-devops.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bxhealth-epiccarelink-demo
                port:
                  number: 80
  tls:
    - hosts:
        - bxhealth-epiccarelink-demo.ping-devops.com