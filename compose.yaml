name: bxhealth-epiccarelink-demo

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: bxhealth-epiccarelink-demo:local
    env_file: .env
    environment:
      PORT: "3010"
    ports:
      - "3010:3010"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3010/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped